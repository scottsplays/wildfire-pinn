[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wildfire-pinn"
version = "0.1.0"
description = "Level-set physics-informed neural network for wildfire spread"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.2",
    "numpy>=1.26",
    "pandas>=2.0",
    "matplotlib>=3.8",
    "xarray>=2024.1",
    "netCDF4>=1.6",
    "scipy>=1.11",
    "shapely>=2.0",
    "geopandas>=1.0",
    "pyproj>=3.5",
    "rasterio>=1.3",
    "rioxarray>=0.15",
    "scikit-image>=0.22",
    "alphashape>=1.3",
    "requests>=2.31",
]

[project.scripts]
wildfire-pinn = "wildfire_pinn.cli:main"

[tool.setuptools.packages.find]
include = ["wildfire_pinn*"]
